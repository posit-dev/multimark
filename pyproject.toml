[build-system]
requires = ["setuptools>=68", "setuptools_scm>=6.2", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "multimark"
dynamic = ["version"]
description = "Python bindings to cmark: CommonMark parsing and rendering (HTML, LaTeX, man, XML)"
readme = "README.md"
license = "MIT AND BSD-2-Clause"
requires-python = ">=3.9"
dependencies = ["cffi>=1.15", "click>=8.0"]
authors = [{name = "Rich Iannone"}]
keywords = ["markdown", "commonmark", "cmark-gfm", "html", "latex", "gfm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.scripts]
multimark = "multimark._cli:main"

[project.urls]
Homepage = "https://github.com/posit-dev/multimark"
Issues = "https://github.com/posit-dev/multimark/issues"

[tool.setuptools]
packages = ["multimark"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
multimark = ["*.h"]

[tool.setuptools_scm]

[tool.cibuildwheel]
build = "cp39-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_i686"
test-requires = ["pytest"]
test-command = "pytest {project}/tests -x"
before-build = "git config --global --add safe.directory /project"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.pyodide]
build = "cp313-*"
skip = ""
before-build = ""
test-requires = ["pytest"]
test-command = "python -m pytest {project}/tests -x --ignore={project}/tests/test_cli.py --ignore={project}/tests/test_threads.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["multimark"]
omit = ["src/multimark/_build_cmark.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise MemoryError",
    "if .+ == ffi.NULL",
    "PackageNotFoundError",
]
